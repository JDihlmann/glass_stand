<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel-Glass Key Stand</title>
<style>
  /* one full-screen 3D view with a floating control panel; single dark look by design */
  :root { color-scheme:dark; --bg:#111211; --ink:#f3f1ec; --dim:rgba(243,241,236,.62); --line:rgba(255,255,255,.12); --acc:#3fd0a3; --panel:rgba(22,23,24,.62); --well:rgba(255,255,255,.06); --on:rgba(255,255,255,.92); --on-ink:#141516; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink); font:13px/1.35 -apple-system,BlinkMacSystemFont,"Inter","Helvetica Neue",sans-serif; overflow:hidden; }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  /* loading: the scene first appears soft and slightly enlarged, then sharpens once everything is in place */
  #c { filter:blur(26px) saturate(1.1); transform:scale(1.06); transition:filter 1.2s ease, transform 1.2s ease; }
  body.ready #c { filter:none; transform:none; }
  #loader { position:fixed; inset:0; z-index:5; display:grid; place-items:center; background:var(--bg); transition:background .8s ease, opacity .7s ease; }
  body.first #loader { background:transparent; }
  body.ready #loader { opacity:0; pointer-events:none; }
  #loader .card { display:grid; gap:14px; justify-items:center; padding:18px 22px; border-radius:16px; background:var(--panel); border:1px solid var(--line); backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px); }
  #loader p { margin:0; font-size:13px; color:var(--ink); letter-spacing:.01em; }
  #loader .bar { width:150px; height:3px; border-radius:2px; background:var(--well); overflow:hidden; }
  #loader .bar i { display:block; width:40%; height:100%; border-radius:2px; background:var(--acc); animation:slide 1.1s ease-in-out infinite alternate; }
  @keyframes slide { from { transform:translateX(-20%); } to { transform:translateX(170%); } }
  @media (prefers-reduced-motion: reduce) { #loader .bar i { animation:none; width:100%; opacity:.6; } #c { transition:none; } }
  #panel { transition:opacity .6s ease .3s; } body:not(.ready) #panel { opacity:0; pointer-events:none; }
  #panel { position:fixed; right:max(14px, env(safe-area-inset-right, 0px)); top:calc(14px + env(safe-area-inset-top, 0px)); width:300px; max-height:calc(100% - 28px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); display:flex; flex-direction:column-reverse; border-radius:18px;
    background:var(--panel); backdrop-filter:blur(22px) saturate(1.3); -webkit-backdrop-filter:blur(22px) saturate(1.3); border:1px solid var(--line); box-shadow:0 12px 40px rgba(0,0,0,.35); overflow:hidden; }
  body.collapsed #panel { display:none; }
  [hidden] { display:none !important; }
  .tabs { display:flex; gap:2px; padding:6px; }
  .tabs button { flex:1; min-width:0; height:42px; border:0; border-radius:12px; background:transparent; color:var(--dim); cursor:pointer; display:grid; place-items:center; transition:background .15s,color .15s; }
  .tabs button svg { width:22px; height:22px; }
  .tabs button:hover { color:var(--ink); background:var(--well); }
  .tabs button.on { background:var(--on); color:var(--on-ink); }
  .body { overflow-y:auto; overscroll-behavior:contain; padding:4px 14px 12px; border-top:1px solid var(--line); scrollbar-width:thin; }
  #panel.closed .body { display:none; }
  h3 { margin:10px 0 9px; font-size:11px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--dim); }
  .seg { display:flex; gap:4px; padding:3px; border-radius:11px; background:var(--well); margin-bottom:8px; }
  .seg.wrap { flex-wrap:wrap; } .seg.wrap button { flex:1 1 30%; }
  button { font:inherit; color:var(--ink); }
  .seg button { flex:1; min-height:36px; border:0; background:transparent; padding:6px 6px; border-radius:8px; cursor:pointer; color:var(--dim); white-space:nowrap; transition:background .15s,color .15s; }
  .seg button:hover { color:var(--ink); background:var(--well); }
  .seg button.on { background:var(--on); color:var(--on-ink); font-weight:600; }
  .ghost { width:100%; min-height:36px; border:1px solid var(--line); background:transparent; padding:6px; border-radius:10px; cursor:pointer; color:var(--dim); } .ghost:hover { color:var(--ink); border-color:var(--dim); }
  button:focus-visible, input:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  .slider { display:block; margin:10px 0 8px; } .slider div { display:flex; justify-content:space-between; margin-bottom:6px; } .slider em { font-style:normal; color:var(--dim); font-variant-numeric:tabular-nums; }
  input[type=range] { width:100%; accent-color:var(--acc); height:24px; margin:0; }
  /* phones: a sheet docked to the bottom, tabs always reachable, the open section scrolls */
  @media (max-width: 700px) {
    #panel { top:auto; left:max(8px, env(safe-area-inset-left, 0px)); right:max(8px, env(safe-area-inset-right, 0px)); bottom:calc(8px + env(safe-area-inset-bottom, 0px)); width:auto; max-height:56%; flex-direction:column; }
    .body { border-top:0; border-bottom:1px solid var(--line); }
    .tabs button { height:46px; }
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<aside id="panel"></aside>
<div id="loader" role="status"><div class="card"><div class="bar"><i></i></div><p id="loader-text">Building the room…</p></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>
